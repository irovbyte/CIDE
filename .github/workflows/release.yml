name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Get Version from Tag
      id: get_version
      run: |
        $TAG = "${{ github.ref_name }}"
        $VERSION = $TAG.TrimStart('v')
        echo "APP_VERSION=$VERSION" >> $env:GITHUB_ENV

    - name: Publish Windows
      run: dotnet publish CIDE.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win

    - name: Copy Icon for Installer
      run: Copy-Item -Path Assets\cide_logo.ico -Destination publish/win/cide_logo.ico

    - name: Build Windows Installer (Inno Setup)
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.APP_VERSION }} CIDE.iss

    - name: Rename raw exe
      run: Rename-Item -Path publish/win/CIDE.exe -NewName CIDE_Raw.exe

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Output/CIDE_Setup.exe
          publish/win/CIDE_Raw.exe
        name: CIDE Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
