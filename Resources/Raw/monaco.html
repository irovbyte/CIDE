<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1E1E1E;
            overflow: hidden;
        }

        #container {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="monaco/vs/loader.js"></script>
</head>
<body>
    <div id="container"></div>
    <script>
        require.config({ paths: { 'vs': 'monaco/vs' } });

        window.editor = null;

        require(['vs/editor/editor.main'], function () {
            window.editor = monaco.editor.create(document.getElementById('container'), {
                value: '// CIDE (C-Family IDE) Initialized\n// C, C++, C# Ready...',
                language: 'csharp',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: true },
                fontFamily: 'Consolas',
                fontSize: 14
            });

            window.editor.onDidChangeModelContent(function (e) {
                if (!window.isUpdatingFromCSharp) {
                    window.location.href = "cide://modified";
                }
            });

            window.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
                window.location.href = "cide://save";
            });
        });

        function setEditorText(text, lang) {
            if (window.editor) {
                window.isUpdatingFromCSharp = true;
                monaco.editor.setModelLanguage(window.editor.getModel(), lang);

                window.editor.setValue(text);

                window.isUpdatingFromCSharp = false;
            }
        }
        
        function getEditorText() {
            return window.editor ? window.editor.getValue() : '';
        }
    </script>
</body>
</html>
