<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIDE Editor</title>

    <link rel="stylesheet" href="monaco/vs/editor/editor.main.css" />

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            background: #0A0910;
        }

        #app {
            height: 100%;
            width: 100%;
        }

        #editor-container {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="app">Загрузка...</div>

    <script src="_framework/blazor.webview.js"></script>
    <script src="monaco/vs/loader.js"></script>
    <script>
        require.config({ paths: { 'vs': 'monaco/vs' } });

        window.cideEditor = {
            _editor: null,
            _ready: false,
            _attached: false,

            ensureInit: function () {
                var container = document.getElementById('editor-container');
                if (!container) {
                    window.cideEditor._attached = false;
                    return;
                }

                if (window.cideEditor._attached) {
                    return;
                }

                if (!window.cideEditor._ready) {
                    require(['vs/editor/editor.main'], function () {
                        window.cideEditor._ready = true;
                        window.cideEditor._mountEditor();
                    });
                } else {
                    window.cideEditor._mountEditor();
                }
            },

            _mountEditor: function () {
                var container = document.getElementById('editor-container');
                if (!container) return;

                if (window.cideEditor._editor) {
                    window.cideEditor._editor.dispose();
                    window.cideEditor._editor = null;
                }

                window.cideEditor._editor = monaco.editor.create(container, {
                    value: '',
                    language: 'plaintext',
                    theme: 'vs-dark',
                    automaticLayout: true,
                    fontSize: 13,
                    fontFamily: "'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace",
                    fontLigatures: true,
                    lineHeight: 20,
                    renderWhitespace: 'boundary',
                    minimap: { enabled: true, scale: 1 },
                    scrollBeyondLastLine: false,
                    smoothScrolling: true,
                    cursorBlinking: 'smooth',
                    cursorSmoothCaretAnimation: 'on',
                    bracketPairColorization: { enabled: true },
                    wordWrap: 'off',
                    padding: { top: 8, bottom: 8 }
                });

                window.cideEditor._attached = true;
            },

            setCode: function (code, language) {
                if (!window.cideEditor._editor) return;
                var model = window.cideEditor._editor.getModel();
                if (!model) return;

                monaco.editor.setModelLanguage(model, language || 'plaintext');

                model.pushEditOperations(
                    [],
                    [{ range: model.getFullModelRange(), text: code || '' }],
                    function () { return null; }
                );

                window.cideEditor._editor.setScrollPosition({ scrollTop: 0 });
                window.cideEditor._editor.focus();
            },

            getCode: function () {
                return window.cideEditor._editor
                    ? window.cideEditor._editor.getValue()
                    : '';
            }
        };
    </script>
</body>
</html>
